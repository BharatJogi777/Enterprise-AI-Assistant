[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"
[project]
name="enterprise-ai-assistant"
version="0.1.0"
description="Local-first enterprise AI assistant with Ollama and grounded RAG"
readme="README.md"
requires-python=">=3.12"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","httpx>=0.27,<1","pydantic>=2.7,<3","pydantic-settings>=2.2,<3","psycopg[binary]>=3.2,<4","python-multipart>=0.0.9,<1"]
[project.optional-dependencies]
dev=["pytest>=8,<9","pytest-asyncio>=0.23,<2","ruff>=0.6,<1"]
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
asyncio_mode="auto"
testpaths=["tests"]
[tool.ruff]
line-length=100
target-version="py312"
